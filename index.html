<style>
:root{--bg:#f7f6f3;--surface:#fff;--border:#e4e2db;--border-md:#ccc9bf;--text:#1a1916;--muted:#7a7870;--hint:#b0aea6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
a{text-decoration:none}
.shell{max-width:980px;margin:0 auto;padding:0 1.25rem 4rem}
header{padding:1.75rem 0 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:10px;background:#1a1916;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:15px;font-weight:500;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.lang-btn{display:flex;border:1px solid var(--border-md);border-radius:8px;overflow:hidden}
.lang-opt{padding:5px 11px;font-size:11px;font-weight:500;cursor:pointer;background:transparent;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;transition:background .12s,color .12s}
.lang-opt.active{background:var(--text);color:var(--bg)}
.gh-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;transition:color .15s,border-color .15s}
.gh-btn:hover{color:var(--text);border-color:var(--border-md)}
.stats{display:flex;gap:6px;margin-bottom:1rem}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center}
.stat-n{font-size:18px;font-weight:500;font-family:'DM Mono',monospace}
.stat-l{font-size:10px;color:var(--muted);margin-top:1px}
.search-wrap{position:relative;margin-bottom:.75rem}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--hint);pointer-events:none}
#q{width:100%;padding:8px 12px 8px 34px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s}
#q:focus{border-color:var(--border-md)}
#q::placeholder{color:var(--hint)}
.sync{font-size:11px;color:var(--hint);display:flex;align-items:center;gap:5px;margin-bottom:1.5rem}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}
.section-label{font-size:10px;font-weight:500;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.cycle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:2rem}
.card{border-radius:12px;padding:1.1rem;border-width:1px;border-style:solid}
.icon-box{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:.7rem}
.card-name{font-size:.88rem;font-weight:500;line-height:1.3;margin-bottom:.15rem}
.card-abrev{font-size:.72rem;margin-bottom:.8rem}
.dual-badge{display:flex;gap:.35rem;margin-bottom:.6rem}
.dbadge{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:20px}
.card-divider{border-top-width:1px;border-top-style:solid;padding-top:.6rem;display:flex;flex-direction:column;gap:.3rem}
.curso-btn{width:100%;font-size:.78rem;display:flex;justify-content:space-between;align-items:center;padding:.32rem .55rem;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.curso-btn:hover{opacity:.8}
.arrow{transition:transform .2s;display:inline-block}
.arrow.open{transform:rotate(90deg)}
.modulos{overflow:hidden;max-height:0;transition:max-height .3s ease}
.modulos.open{max-height:900px}
.modulos-inner{padding:.35rem 0 .1rem;display:flex;flex-direction:column;gap:1px}
.mod-item{display:flex;justify-content:space-between;align-items:center;padding:.26rem .55rem;font-size:.76rem;border-radius:5px;transition:opacity .15s}
.mod-item:hover{opacity:.75}
.mod-left{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.mod-name-txt{flex:1}
.badge-mat{font-size:.63rem;font-weight:500;padding:.1rem .4rem;border-radius:99px;white-space:nowrap;flex-shrink:0}
.empty{text-align:center;padding:3rem;font-size:13px;color:var(--hint);display:none}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--hint)}
footer a{color:var(--hint)}
footer a:hover{color:var(--muted)}
</style>
</head>

// ════════════════════════════════════════════════════════════
// ESTADO
// ════════════════════════════════════════════════════════════
let lang = 'ca';
function t(k){ return T[lang][k] || k; }

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function renderMod(m, c){
  const name = t(m.id);
  const hasMat = m.profs && m.profs.length > 0;
  const url  = hasMat ? m.profs[0].url : null;
  const badge = hasMat ? `<span class="badge-mat" style="background:rgba(0,0,0,0.08);color:${c.tc}">● Material</span>` : '';
  const tag  = url ? 'a' : 'span';
  const href = url ? `href="${url}" target="_blank" rel="noopener"` : '';
  return `<${tag} ${href} class="mod-item" style="color:${c.tc}" data-id="${m.id}" data-search="${name.toLowerCase()} ${m.id}">
    <span class="mod-left"><span class="mod-name-txt">${name}</span>${badge}</span>
    <span style="color:${c.tl};flex-shrink:0;margin-left:4px">→</span>
  </${tag}>`;
}

function renderCurso(cu, c, idx){
  const mods = cu.mods.map(m=>renderMod(m,c)).join('');
  const open = idx===0;
  return `<button class="curso-btn" style="background:${c.btn};color:${c.tc}" onclick="tog('${cu.id}','a${cu.id}')">
    <span data-ckey="${cu.key}">${t(cu.key)}</span>
    <span class="arrow${open?' open':''}" id="a${cu.id}">→</span>
  </button>
  <div class="modulos${open?' open':''}" id="${cu.id}">
    <div class="modulos-inner">${mods}</div>
  </div>`;
}

function renderCicle(c){
  const name = t(c.key);
  const abrevSub = c.abrevSub ? (lang==='ca' ? c.abrevSub.split('|')[0].trim() : c.abrevSub.split('|')[1].trim()) : c.abrev;
  const dualHtml = c.dual
    ? `<div class="dual-badge"><span class="dbadge" style="background:${c.dual.bg1};color:${c.dual.c1}">${c.dual.b1}</span><span class="dbadge" style="background:${c.dual.bg2};color:${c.dual.c2}">${c.dual.b2}</span></div>`
    : '';
  const cursos = c.cursos.map((cu,i)=>renderCurso(cu,c,i)).join('');
  const totalMods = c.cursos.reduce((s,cu)=>s+cu.mods.length,0);
  const totalMat  = c.cursos.reduce((s,cu)=>s+cu.mods.filter(m=>m.profs&&m.profs.length>0).length,0);
  return `<div class="card" style="background:${c.bg};border-color:${c.border}" data-cicle="${c.id}" data-search="${name.toLowerCase()} ${c.abrev.toLowerCase()}" data-mods="${totalMods}" data-mat="${totalMat}">
    <div class="icon-box" style="background:${c.ibg};color:${c.ic}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${c.icon}"/></svg>
    </div>
    ${dualHtml}
    <p class="card-name" style="color:${c.tc}" data-namekey="${c.key}">${name}</p>
    <p class="card-abrev" style="color:${c.tl}" data-abrev="${c.id}">${abrevSub}</p>
    <div class="card-divider" style="border-top-color:${c.div}">${cursos}</div>
  </div>`;
}

function renderSection(s){
  const cicles = s.cicles.map(renderCicle).join('');
  return `<p class="section-label" data-seckey="${s.sec}">${t(s.sec)}</p>
  <div class="cycle-grid" id="g-${s.sec}">${cicles}</div>`;
}

function renderAll(){
  document.getElementById('portal').innerHTML = DATOS.map(renderSection).join('');
  updateStats();
}

function updateStats(){
  let mods=0,mat=0;
  DATOS.forEach(s=>s.cicles.forEach(c=>c.cursos.forEach(cu=>{
    mods+=cu.mods.length;
    mat+=cu.mods.filter(m=>m.profs&&m.profs.length>0).length;
  })));
  document.getElementById('sl-n-mods').textContent=mods;
  document.getElementById('sl-n-mat').textContent=mat;
}

// ════════════════════════════════════════════════════════════
// TOGGLE
// ════════════════════════════════════════════════════════════
function tog(id,aid){
  const el=document.getElementById(id);
  const ar=document.getElementById(aid);
  if(el){el.classList.toggle('open');}
  if(ar){ar.classList.toggle('open');}
}

// ════════════════════════════════════════════════════════════
// IDIOMA
// ════════════════════════════════════════════════════════════
function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-opt').forEach(b=>{
    b.classList.toggle('active',(l==='ca'&&b.textContent==='VAL')||(l==='es'&&b.textContent==='CAS'));
  });
  document.getElementById('brand-name').textContent=t('brandName');
  document.getElementById('brand-sub').textContent=t('brandSub');
  document.getElementById('sl-cicles').textContent=t('cicles');
  document.getElementById('sl-mods').textContent=t('mods');
  document.getElementById('sl-mat').textContent=t('mat');
  document.getElementById('sync-txt').textContent=t('sync');
  document.getElementById('q').placeholder=t('ph');
  document.getElementById('empty').textContent=t('empty');
  document.querySelectorAll('[data-seckey]').forEach(el=>el.textContent=t(el.dataset.seckey));
  document.querySelectorAll('[data-namekey]').forEach(el=>el.textContent=t(el.dataset.namekey));
  document.querySelectorAll('[data-abrev]').forEach(el=>{
    const cid=el.dataset.abrev;
    const c=DATOS.flatMap(s=>s.cicles).find(x=>x.id===cid);
    if(c&&c.abrevSub) el.textContent=(l==='ca'?c.abrevSub.split('|')[0]:c.abrevSub.split('|')[1]).trim();
  });
  document.querySelectorAll('[data-ckey]').forEach(el=>el.textContent=t(el.dataset.ckey));
  document.querySelectorAll('.mod-item').forEach(el=>{
    const mid=el.dataset.id;
    if(mid){
      const nm=t(mid);
      el.querySelector('.mod-name-txt').textContent=nm;
      el.dataset.search=nm.toLowerCase()+' '+mid;
    }
  });
}

// ════════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  document.getElementById('q').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    let any=false;
    document.querySelectorAll('.mod-item').forEach(m=>{
      m.style.display=(!q||m.dataset.search.includes(q))?'':'none';
    });
    document.querySelectorAll('.modulos').forEach(ml=>{
      const vis=[...ml.querySelectorAll('.mod-item')].some(m=>m.style.display!=='none');
      if(q&&vis)ml.classList.add('open');
    });
    document.querySelectorAll('[data-cicle]').forEach(card=>{
      const vis=card.dataset.search.includes(q)||[...card.querySelectorAll('.mod-item')].some(m=>m.style.display!=='none');
      card.style.display=(!q||vis)?'':'none';
      if(vis)any=true;
    });
    document.querySelectorAll('.cycle-grid').forEach(g=>{
      const vis=[...g.querySelectorAll('[data-cicle]')].some(c=>c.style.display!=='none');
      g.style.display=vis?'':'none';
      if(g.previousElementSibling)g.previousElementSibling.style.display=vis?'':'none';
    });
    document.getElementById('empty').style.display=(!q||any)?'none':'block';
  });
});
</script>
