name: Actualitzar portal

on:
  schedule:
    # Cada nit a les 02:00 UTC (04:00 hora espanyola)
    - cron: '0 2 * * *'
  workflow_dispatch:  # permet llançar-ho manualment des de GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerar index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Canvia açò per ieselcaminas quan migres
          ORG: pedrosegarra
        run: python3 .github/scripts/generate_portal.py

      - name: Commit si hi ha canvis
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: actualitzar portal [skip ci]"
          git push
